---
# params
# output_file: file path where to store the JSON result of win_updates module
- hosts: all
  # avoid polluting even more the guest
  gather_facts: no
  tasks:
    - name: searching for updates
      win_updates:
        state: searched
      register: wu_state

    - name: write search results to a file
      local_action:
        module: copy
        content: "{{ wu_state }}"
        dest: "{{ output_file }}"
